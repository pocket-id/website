name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, preview]

jobs:
  check:
    name: Format, lint and type check
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true

      # astro check generates the types of Astro's virtual modules, which vp check needs too
      - name: Run checks
        run: vp run check
