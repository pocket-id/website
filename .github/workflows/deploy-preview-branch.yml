name: Deploy Preview Branch

on:
  workflow_dispatch:
  push:
    branches:
      - preview
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "astro.config.mjs"
      - "vercel.json"
      - ".github/workflows/deploy-preview-branch.yml"
      - ".github/actions/deploy-vercel/**"

permissions:
  contents: read

jobs:
  deploy-preview-branch:
    runs-on: ubuntu-latest
    name: Deploy Preview Branch to Vercel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pocket-id repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pocket-id/pocket-id
          path: pocket-id
          ref: main

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pocket-id/backend/go.mod

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Setup Node.js and pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm build
        env:
          POCKET_ID_DIR: pocket-id
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Vercel
        uses: ./.github/actions/deploy-vercel
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # A stable address for the docs of the unreleased version, optional
          alias: ${{ vars.VERCEL_PREVIEW_DOMAIN }}
