name: Update pocket-id Changelog

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-changelog
  cancel-in-progress: false

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Get latest release
        id: latest
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.github.com/repos/pocket-id/pocket-id/releases/latest'
          method: 'GET'
          bearerToken: ${{ secrets.GITHUB_TOKEN }}
          customHeaders: '{"Accept":"application/vnd.github+json"}'
          responseFile: 'release.json'

      - name: Prepare current changelog
        run: |
          mkdir -p src/content/docs
          [[ -f src/content/docs/changelog.md ]] && cp src/content/docs/changelog.md src/content/docs/changelog.current.md || true

      - name: Build updated changelog
        id: build
        shell: bash
        run: |
          set -euo pipefail

          TAG=$(jq -r .tag_name release.json)
          DATE=$(jq -r .published_at release.json | cut -dT -f1)
          URL=$(jq -r .html_url release.json)
          BODY=$(jq -r '.body // ""' release.json)

          echo "version=$TAG" >> "$GITHUB_OUTPUT"

          # If changelog exists and already has this tag, skip
          if [[ -f src/content/docs/changelog.current.md ]] && grep -qE "^##[[:space:]]+$TAG\b" src/content/docs/changelog.current.md; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SECTION_FILE=/tmp/section.md
          {
            echo "## $TAG${DATE:+ - $DATE}"
            echo
            echo "[Release]($URL)"
            echo
            printf "%s\n" "$BODY"
          } > "$SECTION_FILE"

          DEFAULT_FM="---"$'\n'"title: Changelog"$'\n'"description: Release notes for every Pocket ID version."$'\n'"editUrl: false"$'\n'"tableOfContents:"$'\n'"  maxHeadingLevel: 2"$'\n'"---"

          if [[ -f src/content/docs/changelog.current.md ]]; then
            if head -n1 src/content/docs/changelog.current.md | grep -q '^---$'; then
              END_LINE=$(awk '/^---$/{i++} i==2{print NR; exit}' src/content/docs/changelog.current.md || true)
              if [[ -n "${END_LINE:-}" ]]; then
                head -n "$END_LINE" src/content/docs/changelog.current.md > src/content/docs/changelog.md
                echo >> src/content/docs/changelog.md
                cat "$SECTION_FILE" >> src/content/docs/changelog.md
                echo >> src/content/docs/changelog.md
                tail -n +"$((END_LINE+1))" src/content/docs/changelog.current.md >> src/content/docs/changelog.md
              else
                printf "%s\n\n" "$DEFAULT_FM" > src/content/docs/changelog.md
                cat "$SECTION_FILE" >> src/content/docs/changelog.md
                echo >> src/content/docs/changelog.md
                cat src/content/docs/changelog.current.md >> src/content/docs/changelog.md
              fi
            else
              printf "%s\n\n" "$DEFAULT_FM" > src/content/docs/changelog.md
              cat "$SECTION_FILE" >> src/content/docs/changelog.md
              echo >> src/content/docs/changelog.md
              cat src/content/docs/changelog.current.md >> src/content/docs/changelog.md
            fi
          else
            printf "%s\n\n" "$DEFAULT_FM" > src/content/docs/changelog.md
            cat "$SECTION_FILE" >> src/content/docs/changelog.md
            echo >> src/content/docs/changelog.md
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Create bot app token
        if: steps.build.outputs.updated == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit changelog to main
        if: steps.build.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.build.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_name="$APP_SLUG[bot]"
          bot_id=$(gh api "users/$bot_name" --jq .id)
          git config user.name "Pocket ID Bot"
          git config user.email "$bot_id+$bot_name@users.noreply.github.com"
          gh auth setup-git

          git add src/content/docs/changelog.md
          git commit --signoff -m "docs(changelog): add $VERSION release notes"
          git push origin HEAD:refs/heads/main
