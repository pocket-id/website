info:
  contact: {}
  description: |
    Pocket ID API Reference
  title: Pocket ID API
  version: "1.0"
paths:
  /.well-known/jwks.json:
    get:
      description: Returns the JSON Web Key Set used for token verification
      produces:
      - application/json
      responses:
        "200":
          description: '{ \"keys\": []interface{} }'
          schema:
            type: object
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: Get JSON Web Key Set (JWKS)
      tags:
      - Well Known
  /.well-known/oauth-authorization-server:
    get:
      description: Returns the RFC 8414 OAuth 2.0 authorization server metadata document
        with endpoints and capabilities
      responses:
        "200":
          description: OAuth 2.0 authorization server metadata
          schema:
            type: object
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: Get OAuth 2.0 authorization server metadata
      tags:
      - Well Known
  /.well-known/openid-configuration:
    get:
      description: Returns the OpenID Connect discovery document with endpoints and
        capabilities
      responses:
        "200":
          description: OpenID Connect configuration
          schema:
            type: object
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: Get OpenID Connect discovery configuration
      tags:
      - Well Known
  /api/api-access/{clientId}/apis:
    get:
      description: Get every API the OIDC client may request tokens for, with its
        access and permissions split into user-delegated and client (machine-to-machine)
        access
      parameters:
      - description: OIDC Client ID
        in: path
        name: clientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.clientApiGrantDto'
            type: array
      summary: List APIs a client may access
      tags:
      - APIs
  /api/api-access/{clientId}/assignable-apis:
    get:
      description: Get a paginated list of APIs the OIDC client cannot already reach
      parameters:
      - description: OIDC Client ID
        in: path
        name: clientId
        required: true
        type: string
      - description: Search term to filter APIs by name or resource
        in: query
        name: search
        type: string
      - default: 1
        description: Page number for pagination
        in: query
        name: pagination[page]
        type: integer
      - default: 20
        description: Number of items per page
        in: query
        name: pagination[limit]
        type: integer
      - description: Column to sort by
        in: query
        name: sort[column]
        type: string
      - default: '"asc"'
        description: Sort direction (asc or desc)
        in: query
        name: sort[direction]
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_pocket-id_pocket-id_backend_internal_dto.Paginated-api_apiResponseDto'
      summary: List APIs a client can still be granted access to
      tags:
      - APIs
  /api/api-keys:
    get:
      description: Get a paginated list of API keys belonging to the current user
      parameters:
      - default: 1
        description: Page number for pagination
        in: query
        name: pagination[page]
        type: integer
      - default: 20
        description: Number of items per page
        in: query
        name: pagination[limit]
        type: integer
      - description: Column to sort by
        in: query
        name: sort[column]
        type: string
      - default: '"asc"'
        description: Sort direction (asc or desc)
        in: query
        name: sort[direction]
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_pocket-id_pocket-id_backend_internal_dto.Paginated-apikey_apiKeyDto'
      summary: List API keys
      tags:
      - API Keys
    post:
      description: Create a new API key for the current user
      parameters:
      - description: API key information
        in: body
        name: api_key
        required: true
        schema:
          $ref: '#/definitions/apikey.apiKeyCreateDto'
      responses:
        "201":
          description: Created API key with token
          schema:
            $ref: '#/definitions/apikey.apiKeyResponseDto'
      summary: Create API key
      tags:
      - API Keys
  /api/api-keys/{id}:
    delete:
      description: Revoke (delete) an existing API key by ID
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Revoke API key
      tags:
      - API Keys
  /api/api-keys/{id}/renew:
    post:
      description: Renew an existing API key by ID
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Renewed API key with new token
          schema:
            $ref: '#/definitions/apikey.apiKeyResponseDto'
      summary: Renew API key
      tags:
      - API Keys
  /api/apis:
    get:
      description: Get a paginated list of APIs with optional search and sorting
      parameters:
      - description: Search term to filter APIs by name or resource
        in: query
        name: search
        type: string
      - default: 1
        description: Page number for pagination
        in: query
        name: pagination[page]
        type: integer
      - default: 20
        description: Number of items per page
        in: query
        name: pagination[limit]
        type: integer
      - description: Column to sort by
        in: query
        name: sort[column]
        type: string
      - default: '"asc"'
        description: Sort direction (asc or desc)
        in: query
        name: sort[direction]
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_pocket-id_pocket-id_backend_internal_dto.Paginated-api_apiResponseDto'
      summary: List APIs
      tags:
      - APIs
    post:
      consumes:
      - application/json
      description: Create a new API resource server
      parameters:
      - description: API information
        in: body
        name: api
        required: true
        schema:
          $ref: '#/definitions/api.apiCreateDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created API
          schema:
            $ref: '#/definitions/api.apiResponseDto'
      summary: Create API
      tags:
      - APIs
  /api/apis/{id}:
    delete:
      description: Delete an API by ID
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete API
      tags:
      - APIs
    get:
      description: Retrieve a single API including its permissions
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.apiResponseDto'
      summary: Get API by ID
      tags:
      - APIs
    put:
      consumes:
      - application/json
      description: Update an existing API by ID
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: string
      - description: API information
        in: body
        name: api
        required: true
        schema:
          $ref: '#/definitions/api.apiUpdateDto'
      produces:
      - application/json
      responses:
        "200":
          description: Updated API
          schema:
            $ref: '#/definitions/api.apiResponseDto'
      summary: Update API
      tags:
      - APIs
  /api/apis/{id}/assignable-clients:
    get:
      description: Get a paginated list of OIDC clients that have no grant on the
        API yet
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: string
      - description: Search term to filter clients by name
        in: query
        name: search
        type: string
      - default: 1
        description: Page number for pagination
        in: query
        name: pagination[page]
        type: integer
      - default: 20
        description: Number of items per page
        in: query
        name: pagination[limit]
        type: integer
      - description: Column to sort by
        in: query
        name: sort[column]
        type: string
      - default: '"asc"'
        description: Sort direction (asc or desc)
        in: query
        name: sort[direction]
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_pocket-id_pocket-id_backend_internal_dto.Paginated-api_apiClientDto'
      summary: List clients that can still be granted access to an API
      tags:
      - APIs
  /api/apis/{id}/cimd-access:
    put:
      consumes:
      - application/json
      description: Replace which permissions of an API every client registered through
        a Client ID Metadata Document may request
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: string
      - description: Metadata document client access
        in: body
        name: access
        required: true
        schema:
          $ref: '#/definitions/api.apiCimdAccessUpdateDto'
      produces:
      - application/json
      responses:
        "200":
          description: Updated API
          schema:
            $ref: '#/definitions/api.apiResponseDto'
      summary: Update metadata document client access
      tags:
      - APIs
  /api/apis/{id}/clients:
    get:
      description: Get a paginated list of OIDC clients that may reach the API, with
        their permissions split into user-delegated and client (machine-to-machine)
        access
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: string
      - description: Search term to filter clients by name
        in: query
        name: search
        type: string
      - default: 1
        description: Page number for pagination
        in: query
        name: pagination[page]
        type: integer
      - default: 20
        description: Number of items per page
        in: query
        name: pagination[limit]
        type: integer
      - description: Column to sort by
        in: query
        name: sort[column]
        type: string
      - default: '"asc"'
        description: Sort direction (asc or desc)
        in: query
        name: sort[direction]
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_pocket-id_pocket-id_backend_internal_dto.Paginated-api_apiClientAccessDto'
      summary: List clients with access to an API
      tags:
      - APIs
  /api/apis/{id}/clients/{clientId}:
    delete:
      description: Remove every permission of this API a single OIDC client was allowed
        to request
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: string
      - description: OIDC Client ID
        in: path
        name: clientId
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Revoke a client's access to an API
      tags:
      - APIs
    put:
      consumes:
      - application/json
      description: Replace the permissions of this API a single OIDC client may request,
        leaving its grants on other APIs untouched
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: string
      - description: OIDC Client ID
        in: path
        name: clientId
        required: true
        type: string
      - description: Access and allowed permission IDs per subject type
        in: body
        name: access
        required: true
        schema:
          $ref: '#/definitions/api.apiClientGrantUpdateDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.apiClientGrantDto'
      summary: Update a client's access to an API
      tags:
      - APIs
  /api/apis/{id}/permissions:
    put:
      consumes:
      - application/json
      description: Replace the full set of permissions for an API
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: string
      - description: Permissions to set
        in: body
        name: permissions
        required: true
        schema:
          $ref: '#/definitions/api.apiPermissionsUpdateDto'
      produces:
      - application/json
      responses:
        "200":
          description: Updated API
          schema:
            $ref: '#/definitions/api.apiResponseDto'
      summary: Update API permissions
      tags:
      - APIs
  /api/application-configuration:
    get:
      consumes:
      - application/json
      description: Get all public application configurations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PublicAppConfigVariableDto'
            type: array
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: List public application configurations
      tags:
      - Application Configuration
    put:
      consumes:
      - application/json
      description: Update application configuration settings
      parameters:
      - description: Application Configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AppConfigUpdateDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AppConfigVariableDto'
            type: array
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: Update application configurations
      tags:
      - Application Configuration
  /api/application-configuration/all:
    get:
      consumes:
      - application/json
      description: Get all application configurations including private ones
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AppConfigVariableDto'
            type: array
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: List all application configurations
      tags:
      - Application Configuration
  /api/application-configuration/sync-ldap:
    post:
      description: Manually trigger LDAP synchronization
      responses:
        "204":
          description: No Content
      summary: Synchronize LDAP
      tags:
      - Application Configuration
  /api/application-configuration/test-email:
    post:
      description: Send a test email to verify email configuration
      responses:
        "204":
          description: No Content
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: Send test email
      tags:
      - Application Configuration
  /api/application-images/background:
    delete:
      description: Delete the application background image
      responses:
        "204":
          description: No Content
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: Delete background image
      tags:
      - Application Images
    get:
      description: Get the background image for the application
      produces:
      - image/png
      - image/jpeg
      responses:
        "200":
          description: Background image
          schema:
            type: file
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: Get background image
      tags:
      - Application Images
    put:
      consumes:
      - multipart/form-data
      description: Update the application background image
      parameters:
      - description: Background image file
        in: formData
        name: file
        required: true
        type: file
      responses:
        "204":
          description: No Content
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: Update background image
      tags:
      - Application Images
  /api/application-images/default-profile-picture:
    delete:
      description: Delete the default profile picture image
      responses:
        "204":
          description: No Content
        default:
          description: Error
          schema:
            $ref: '#/definitions/dto.ErrorDto'
      summary: Delete default profile picture image
      tags:
      - Application Images
    get:
      description: Get the default profile picture image for the application
      produces:
      - image/png
      - image/jpeg
      responses:
